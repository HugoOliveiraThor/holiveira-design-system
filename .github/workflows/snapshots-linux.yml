name: Snapshot baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: pnpm --filter playground exec playwright install --with-deps chromium

      - run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - run: pnpm --filter playground exec playwright test --update-snapshots --project=export

      - uses: actions/upload-artifact@v7
        with:
          name: playground-linux-snapshots
          path: apps/playground/e2e
